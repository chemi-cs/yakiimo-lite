name: Build and deploy JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify the bundled RDKit wheel
        run: echo "502080ad307325b03a83d9d5d10ef5d44dfa4bb45d55fcab6fc3bc68246e38db  pypi/rdkit-2026.3.6-cp313-cp313-pyemscripten_2025_0_wasm32.whl" | sha256sum --check --strict

      - name: Install the website build dependencies
        run: python -m pip install -r requirements.txt

      - name: Build JupyterLite
        run: |
          jupyter lite build
          touch dist/.nojekyll

      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

